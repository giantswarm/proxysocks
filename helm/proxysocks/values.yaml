serviceType: "managed"
replicaCount: 2

image:
  registry: gsoci.azurecr.io
  name: giantswarm/proxysocks
  tag: ""
  pullPolicy: IfNotPresent

# Authentication configuration
auth:
  enabled: false
  # createSecret renders the htpasswd content below into a Secret. Set to false
  # and use existingSecret to bring your own Secret (must contain an htpasswd key).
  createSecret: true
  existingSecret: ""
  # htpasswd holds credentials in htpasswd format, one entry per line. Only
  # bcrypt hashes are supported, e.g. from `htpasswd -nB user`.
  htpasswd: ""

service:
  type: LoadBalancer
  port: 8000
  annotations:  # @schema additionalProperties: true
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"

metrics:
  port: 8090
  serviceMonitor:
    enabled: true

networkPolicy:
  enabled: true

podDisruptionBudget:
  # Rendered only when replicaCount > 1.
  enabled: true
  minAvailable: 1

podSecurityContext:  # @schema additionalProperties: true
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:  # @schema additionalProperties: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:  # @schema additionalProperties: true
    cpu: 100m
    memory: 100Mi
  limits:  # @schema additionalProperties: true
    memory: 200Mi
